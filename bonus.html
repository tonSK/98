<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bonus ประจำปี</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f6fa; --card:#fff; --ink:#1c2433; --muted:#6b7686; --line:#e3e8ef;
    --brand:#1f5eff; --brand-soft:#e8eeff; --ok:#12805c; --warn:#b45309; --warn-bg:#fff4e0;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans Thai',system-ui,sans-serif;font-size:15px}
  .wrap{max-width:1200px;margin:0 auto;padding:16px}
  h1{font-size:22px;margin:8px 0 4px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
  .seg{display:inline-flex;flex-wrap:wrap;background:#e6eaf2;border-radius:10px;padding:3px}
  .seg button{border:0;background:transparent;padding:8px 20px;border-radius:8px;font:inherit;font-weight:500;color:var(--muted);cursor:pointer}
  .seg button.on{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  input,select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
  input{min-width:200px}
  .btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
  .chip b{color:var(--brand)}
  .chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .chip.on b{color:#fff}
  .chip.empty{opacity:.45}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .card .l{color:var(--muted);font-size:12px}
  .card .v{font-size:20px;font-weight:700;margin-top:2px}
  .note{background:var(--warn-bg);color:var(--warn);border:1px solid #f3d9a6;border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:14px}
  .tbl-wrap{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:70vh}
  table{border-collapse:separate;border-spacing:0;width:100%;white-space:nowrap}
  th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:right}
  th{position:sticky;top:0;background:#f8fafd;font-weight:700;font-size:13px;z-index:2}
  td.t,th.t{text-align:left}
  td.name,th.name{position:sticky;left:0;background:#fff;z-index:1;text-align:left;min-width:170px;border-right:1px solid var(--line)}
  th.name{background:#f8fafd;z-index:3}
  tr:hover td{background:#f5f8ff} tr:hover td.name{background:#f5f8ff}
  td.cum{font-weight:700;background:#fafcff}
  .pill{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--brand-soft);color:var(--brand);font-weight:700}
  .pill.zero{background:#eef0f4;color:var(--muted)}
  .bonus{font-weight:700;color:var(--ok)}
  .half{color:var(--warn);font-weight:500}
  .gap{color:var(--muted);font-size:12px}
  tfoot td{font-weight:700;background:#f8fafd;position:sticky;bottom:0}
  .tiers{margin-top:16px}
  .tiers table{width:auto;min-width:320px}
  .tiers h3{font-size:15px;margin:0 0 8px}
  .msg{padding:30px;text-align:center;color:var(--muted)}
  .err{color:#b42318}
</style>
</head>
<body>
<div class="wrap">
  <h1>ผลงานค่าบำเหน็จประจำปี</h1>
  <div class="sub" id="sub">กำลังโหลดข้อมูล…</div>

  <div class="bar">
    <div class="seg" id="seg">
      <button data-lv="ภาค" class="on">โบนัสภาค</button>
      <button data-lv="ศูนย์">โบนัสศูนย์</button>
      <button data-lv="บริหาร">ค่าบริหารเป้าหมายภาค</button>
    </div>
    <input id="q" placeholder="ค้นหาชื่อ…">
    <button class="btn" id="reload">โหลดใหม่</button>
  </div>

  <div class="chips" id="chips"></div>
  <div class="cards" id="cards"></div>
  <div class="note" id="note" style="display:none">
    <b>หมายเหตุ (ระดับภาค):</b> หากสร้างหน่วยน้อยกว่า 3 หน่วยต่อปี จ่าย 50% ของโบนัสที่ได้
  </div>

  <div class="tbl-wrap"><div id="out" class="msg">กำลังโหลด…</div></div>

  <div class="tiers" id="tiers"></div>
</div>

<script>
// ▼▼▼ ใส่ URL ของ Web App (Apps Script) ตัวเดียวกับที่เว็บเดิมใช้ ▼▼▼
var API_URL = 'https://script.google.com/macros/s/AKfycbzuEabtW0KQKIuQppvSF4D_JWAGz3oYP62UddfWW5aP6vUTqaDB0OYSokJvTi8VhTcY/exec';
// ▲▲▲

// level: 'ภาค' | 'ศูนย์' | 'บริหาร' (ค่าบริหารเป้าหมายภาค ใช้ข้อมูลตำแหน่ง ภาค)
var state = { level:'ภาค', fyc:null, bonus:null, manage:null, manageErr:'', tier:null };

var MONTHS = [
  ['มกราคม','มค','jan','january'],['กุมภาพันธ์','กพ','feb','february'],['มีนาคม','มีค','mar','march'],
  ['เมษายน','เมย','apr','april'],['พฤษภาคม','พค','may'],['มิถุนายน','มิย','jun','june'],
  ['กรกฎาคม','กค','jul','july'],['สิงหาคม','สค','aug','august'],['กันยายน','กย','sep','sept','september'],
  ['ตุลาคม','ตค','oct','october'],['พฤศจิกายน','พย','nov','november'],['ธันวาคม','ธค','dec','december']
];
var MONTH_TH = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

function num(v){
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  if (v == null) return 0;
  var n = parseFloat(String(v).replace(/[,\s฿]/g,''));
  return isFinite(n) ? n : 0;
}
function fmt(n){ return Math.round(n).toLocaleString('en-US'); }
function norm(s){ return String(s == null ? '' : s).replace(/[\s.]/g,'').toLowerCase(); }

function monthOf(h){
  if (h instanceof Date) return h.getMonth();
  var raw = String(h == null ? '' : h).trim();
  var iso = raw.match(/^(\d{4})-(\d{2})-\d{2}T/);
  if (iso) return parseInt(iso[2],10) - 1;
  var s = norm(raw);
  if (!s) return -1;
  if (/^(รวม|สะสม|total|sum|yfc)/.test(s)) return -1;
  for (var i=0;i<12;i++){
    for (var j=0;j<MONTHS[i].length;j++){
      if (s === MONTHS[i][j] || s.indexOf(MONTHS[i][j]) === 0 && s.length <= MONTHS[i][j].length + 6) return i;
    }
  }
  var m = s.match(/^(?:เดือน|m|month)?0?(\d{1,2})$/);
  if (m){ var n = parseInt(m[1],10); if (n>=1 && n<=12) return n-1; }
  return -1;
}

function colIdx(headers, keys){
  for (var i=0;i<headers.length;i++){
    var h = norm(headers[i]);
    for (var k=0;k<keys.length;k++) if (h === norm(keys[k]) || h.indexOf(norm(keys[k])) === 0) return i;
  }
  return -1;
}

// ---------- แปลงชีต FYC ----------
function parseFYC(d){
  var H = d.headers || [], R = d.rows || [];
  var iName = colIdx(H, ['ชื่อ-สกุล','ชื่อ']);
  var iPos  = colIdx(H, ['ตำแหน่ง']);
  var iReg  = colIdx(H, ['ภาค']);
  var iCen  = colIdx(H, ['ศูนย์']);
  var iUnit = colIdx(H, ['หน่วย']);
  var iCode = colIdx(H, ['รหัส']);
  if (iPos < 0) throw new Error('ชีต FYC ไม่พบคอลัมน์ "ตำแหน่ง"');
  var used = {}; [iName,iPos,iReg,iCen,iUnit,iCode].forEach(function(i){ if(i>=0) used[i]=1; });

  var mcols = [];
  for (var c=0;c<H.length;c++){
    if (used[c]) continue;
    var m = monthOf(H[c]);
    if (m >= 0) mcols.push({idx:c, m:m, label:MONTH_TH[m]});
  }
  if (!mcols.length){
    for (var c2=0;c2<H.length;c2++){
      if (used[c2]) continue;
      var s = norm(H[c2]);
      if (!s || /^(รวม|สะสม|total|sum)/.test(s)) continue;
      mcols.push({idx:c2, m:c2, label:String(H[c2])});
    }
  }
  mcols.sort(function(a,b){ return a.m - b.m; });

  var rows = [];
  R.forEach(function(r){
    var pos = String(r[iPos] == null ? '' : r[iPos]).trim();
    if (pos !== 'ภาค' && pos !== 'ศูนย์') return;
    rows.push({
      pos: pos,
      name: iName>=0 ? String(r[iName]||'').trim() : '',
      code: iCode>=0 ? String(r[iCode]||'').trim() : '',
      region: iReg>=0 ? String(r[iReg]||'').trim() : '',
      center: iCen>=0 ? String(r[iCen]||'').trim() : '',
      vals: mcols.map(function(mc){ return num(r[mc.idx]); })
    });
  });
  return { mcols: mcols, rows: rows };
}

// ---------- แปลงชีต Bonus ----------
function parseBonus(d){
  var H = d.headers || [], R = d.rows || [];
  var iPos = colIdx(H, ['ตำแหน่ง']), iF = colIdx(H, ['FYC']), iB = colIdx(H, ['Bonus','โบนัส']);
  if (iPos<0 || iF<0 || iB<0) throw new Error('ชีต Bonus ต้องมีคอลัมน์ ตำแหน่ง / FYC / Bonus');
  var t = {};
  R.forEach(function(r){
    var pos = String(r[iPos]||'').trim(); if (!pos) return;
    var raw = r[iB], p;
    if (typeof raw === 'string' && raw.indexOf('%') >= 0) p = num(raw.replace('%',''))/100;
    else { p = num(raw); if (p > 1) p = p/100; }
    (t[pos] = t[pos] || []).push({ fyc:num(r[iF]), pct:p });
  });
  Object.keys(t).forEach(function(k){ t[k].sort(function(a,b){ return a.fyc - b.fyc; }); });
  return t;
}

// ---------- แปลงชีต Manage (ค่าบริหารเป้าหมายภาค = จำนวนเงินคงที่ตามขั้น FYC) ----------
function parseManage(d){
  var H = d.headers || [], R = d.rows || [];
  var iF = colIdx(H, ['FYC']), iA = colIdx(H, ['ค่าบริหาร']);
  if (iF<0 || iA<0) throw new Error('ชีต Manage ต้องมีคอลัมน์ FYC / ค่าบริหารเป้าหมายภาค');
  var t = [];
  R.forEach(function(r){
    if (r[iF] === '' || r[iF] == null) return;
    t.push({ fyc:num(r[iF]), amt:num(r[iA]) });
  });
  t.sort(function(a,b){ return a.fyc - b.fyc; });
  return t;
}

function tierFor(tiers, cum){
  var cur = {fyc:0,pct:0,amt:0}, next = null;
  for (var i=0;i<tiers.length;i++){
    if (cum >= tiers[i].fyc) cur = tiers[i];
    else { next = tiers[i]; break; }
  }
  return { cur:cur, next:next };
}

// ---------- สร้างข้อมูลแต่ละระดับ ----------
function build(level){
  var f = state.fyc, n = f.mcols.length, out = {};
  f.rows.forEach(function(r){
    if (r.pos !== level || !r.name) return;
    var key = r.name + '|' + r.code;
    var o = out[key] = out[key] || { name:r.name, code:r.code, vals:new Array(n).fill(0) };
    r.vals.forEach(function(v,i){ o.vals[i] += v; });
  });
  return Object.keys(out).map(function(k){ return out[k]; });
}

function render(){
  var lv = state.level, isMg = (lv === 'บริหาร'), dl = isMg ? 'ภาค' : lv, f = state.fyc;

  if (isMg && !state.manage){
    document.getElementById('chips').innerHTML = '';
    document.getElementById('cards').innerHTML = '';
    document.getElementById('note').style.display = 'none';
    document.getElementById('tiers').innerHTML = '';
    document.getElementById('out').className = '';
    document.getElementById('out').innerHTML = '<div class="msg err">โหลดชีต Manage ไม่สำเร็จ: '+esc(state.manageErr)+'</div>';
    return;
  }

  var tiers = isMg ? state.manage : (state.bonus[dl] || []);
  var list = build(dl);

  var show = [];
  f.mcols.forEach(function(mc,i){
    var tot = 0; list.forEach(function(o){ tot += o.vals[i]; });
    if (tot !== 0) show.push(i);
  });

  var pk = function(p){ return p.toFixed(4); };
  list.forEach(function(o){
    o.cum = o.vals.reduce(function(a,b){ return a+b; }, 0);
    var t = tierFor(tiers, o.cum);
    o.next = t.next;
    if (isMg){ o.amt = t.cur.amt; o.bonus = o.amt; o.key = String(o.amt); }
    else { o.pct = t.cur.pct; o.bonus = o.cum * o.pct; o.key = pk(o.pct); }
  });

  var q = norm(document.getElementById('q').value);
  if (q) list = list.filter(function(o){ return norm(o.name).indexOf(q) >= 0; });
  list.sort(function(a,b){ return b.cum - a.cum; });

  // ปุ่มเลือกตามอัตรา/ขั้น พร้อมจำนวน
  var seen = {}, opts = [];
  tiers.forEach(function(t){
    var v = isMg ? t.amt : t.pct, k = isMg ? String(v) : pk(v);
    if (!seen[k]){ seen[k] = 1; opts.push({k:k, v:v}); }
  });
  opts.sort(function(a,b){ return a.v-b.v; });
  var cnt = {}, sumB = {};
  list.forEach(function(o){ cnt[o.key] = (cnt[o.key]||0)+1; sumB[o.key] = (sumB[o.key]||0)+o.bonus; });
  var ch = '<button class="chip'+(state.tier===null?' on':'')+'" data-t="">ทั้งหมด <b>'+list.length+'</b> '+esc(dl)+'</button>';
  opts.forEach(function(p){
    var c = cnt[p.k]||0;
    var label = isMg ? 'ค่าบริหาร '+fmt(p.v) : 'โบนัส '+(p.v*100).toFixed(1)+'%';
    var tip = (isMg ? 'ค่าบริหารรวม ' : 'โบนัสรวม ') + fmt(sumB[p.k]||0);
    ch += '<button class="chip'+(state.tier===p.k?' on':'')+(c?'':' empty')+'" data-t="'+p.k+'" title="'+tip+'">'+label+' <b>'+c+'</b> '+esc(dl)+'</button>';
  });
  document.getElementById('chips').innerHTML = ch;
  if (state.tier !== null) list = list.filter(function(o){ return o.key === state.tier; });

  var isRegion = (lv === 'ภาค');
  document.getElementById('note').style.display = isRegion ? '' : 'none';

  var totCum = 0, totBonus = 0;
  list.forEach(function(o){ totCum += o.cum; totBonus += o.bonus; });
  var last = show.length ? f.mcols[show[show.length-1]].label : '-';
  document.getElementById('cards').innerHTML =
    card('จำนวน'+dl, list.length.toLocaleString()) +
    card('ค่าบำเหน็จสะสมรวม', fmt(totCum)) +
    card(isMg ? 'ค่าบริหารเป้าหมายรวม' : 'โบนัสรวม'+(isRegion?' (100%)':''), fmt(totBonus)) +
    (isRegion ? card('โบนัสรวม ถ้าจ่าย 50%', fmt(totBonus/2)) : '') +
    card('ข้อมูลล่าสุด', last);

  if (!list.length){ document.getElementById('out').innerHTML = '<div class="msg">ไม่พบข้อมูล</div>'; renderTiers(); return; }

  var h = '<table><thead><tr><th class="name">'+dl+'</th>';
  show.forEach(function(i){ h += '<th>'+esc(f.mcols[i].label)+'</th>'; });
  h += '<th>รวม</th>';
  h += isMg ? '<th>ค่าบริหาร</th>' : '<th>%โบนัส</th><th>โบนัส</th>';
  if (isRegion) h += '<th>สร้างหน่วย &lt; 3<br>(จ่าย 50%)</th>';
  h += '<th class="t">ขั้นถัดไป</th></tr></thead><tbody>';

  list.forEach(function(o){
    h += '<tr><td class="name">'+esc(o.name)+'</td>';
    show.forEach(function(i){ h += '<td>'+fmt(o.vals[i])+'</td>'; });
    h += '<td class="cum">'+fmt(o.cum)+'</td>';
    if (isMg){
      h += '<td class="bonus">'+fmt(o.bonus)+'</td>';
    } else {
      h += '<td><span class="pill'+(o.pct?'':' zero')+'">'+(o.pct*100).toFixed(1)+'%</span></td>';
      h += '<td class="bonus">'+fmt(o.bonus)+'</td>';
    }
    if (isRegion) h += '<td class="half">'+fmt(o.bonus/2)+'</td>';
    var nx = 'ขั้นสูงสุดแล้ว';
    if (o.next) nx = 'เพิ่ม '+fmt(o.next.fyc-o.cum)+' รับ '+(isMg ? fmt(o.next.amt) : (o.next.pct*100).toFixed(1)+'%');
    h += '<td class="t gap">'+nx+'</td></tr>';
  });

  h += '</tbody><tfoot><tr><td class="name">รวม</td>';
  show.forEach(function(i){ var s=0; list.forEach(function(o){ s+=o.vals[i]; }); h += '<td>'+fmt(s)+'</td>'; });
  h += '<td>'+fmt(totCum)+'</td>';
  if (!isMg) h += '<td></td>';
  h += '<td class="bonus">'+fmt(totBonus)+'</td>';
  if (isRegion) h += '<td class="half">'+fmt(totBonus/2)+'</td>';
  h += '<td></td></tr></tfoot></table>';
  document.getElementById('out').className = '';
  document.getElementById('out').innerHTML = h;
  renderTiers();
}

function renderTiers(){
  var isMg = state.level === 'บริหาร';
  var tiers = isMg ? (state.manage || []) : (state.bonus[state.level] || []);
  if (!tiers.length){ document.getElementById('tiers').innerHTML=''; return; }
  var title = isMg ? 'เกณฑ์ค่าบริหารเป้าหมายภาค' : 'เกณฑ์โบนัส ระดับ'+esc(state.level);
  var h = '<div class="card"><h3>'+title+'</h3><table><thead><tr><th class="t">ค่าบำเหน็จรวมทั้งปี</th><th>'+(isMg?'ค่าบริหาร':'โบนัส')+'</th></tr></thead><tbody>';
  tiers.forEach(function(t){ h += '<tr><td class="t">'+fmt(t.fyc)+'</td><td>'+(isMg ? fmt(t.amt) : (t.pct*100).toFixed(1)+'%')+'</td></tr>'; });
  document.getElementById('tiers').innerHTML = h + '</tbody></table></div>';
}

function card(l,v){ return '<div class="card"><div class="l">'+esc(l)+'</div><div class="v">'+esc(v)+'</div></div>'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

function get(sheet){
  return fetch(API_URL + (API_URL.indexOf('?')>=0?'&':'?') + 'sheet=' + encodeURIComponent(sheet) + '&_=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(d){ if (d.error) throw new Error(d.error); if (!d.headers) throw new Error('ชีต '+sheet+' ไม่มีข้อมูล (ตรวจว่าแก้ Code.gs และ Deploy เวอร์ชันใหม่แล้ว)'); return d; });
}

function load(){
  document.getElementById('sub').textContent = 'กำลังโหลดข้อมูล…';
  // Manage โหลดแยก: ถ้าพลาด ปุ่มโบนัสเดิมยังใช้งานได้
  var pManage = get('Manage').then(function(d){ state.manage = parseManage(d); state.manageErr = ''; })
    .catch(function(e){ state.manage = null; state.manageErr = e.message; });
  Promise.all([get('FYC'), get('Bonus'), pManage]).then(function(res){
    state.fyc = parseFYC(res[0]);
    state.bonus = parseBonus(res[1]);
    document.getElementById('sub').textContent = 'โหลดข้อมูลสำเร็จ';
    render();
  }).catch(function(e){
    document.getElementById('sub').innerHTML = '<span class="err">โหลดข้อมูลไม่สำเร็จ: '+esc(e.message)+'</span>';
    document.getElementById('out').innerHTML = '<div class="msg err">'+esc(e.message)+'</div>';
  });
}

document.getElementById('chips').addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b) return;
  state.tier = b.dataset.t === '' ? null : b.dataset.t;
  if (state.fyc) render();
});
document.getElementById('seg').addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b) return;
  state.level = b.dataset.lv; state.tier = null;
  [].forEach.call(this.children, function(x){ x.classList.toggle('on', x===b); });
  if (state.fyc) render();
});
document.getElementById('q').addEventListener('input', function(){ if (state.fyc) render(); });
document.getElementById('reload').addEventListener('click', load);
load();
</script>
