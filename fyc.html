<html lang="th">

    <!-- Google Fonts (Kanit) -->

    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #f8fafc;
        }

        /* Sticky header & column styling rules */
        .table-container {
            max-height: calc(100vh - 280px);
            min-height: 400px;
        }

        /* Sticky positioning helpers */
        .sticky-col-1 {
            position: sticky;
            left: 0;
            z-index: 20;
        }

        /* Sticky Headers require higher Z-Index */
        thead th.sticky-col-1 {
            z-index: 40 !important;
        }

        thead tr th {
            position: sticky;
            top: 0;
            z-index: 30;
        }

        /* Custom Scrollbar for Table */
        .table-container::-webkit-scrollbar {
            height: 8px;
            width: 8px;
        }
        .table-container::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .table-container::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .table-container::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* ==========================================
           Print Mode (ปรับให้แสดงข้อมูลครบเต็มหน้า A4 แนวนอน)
           ========================================== */
        @media print {
            @page {
                size: A4 landscape;
                margin: 5mm 5mm;
            }

            html, body {
                background: white !important;
                color: black !important;
                width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                font-size: 8.5pt !important;
            }

            .no-print {
                display: none !important;
            }

            .shadow-sm, .shadow-md, .shadow-lg, .shadow-xl {
                box-shadow: none !important;
            }

            main {
                padding: 0 !important;
                margin: 0 !important;
                width: 100% !important;
            }

            *, *::before, *::after {
                color: #000 !important;
                background: transparent !important;
                background-image: none !important;
                box-shadow: none !important;
                text-shadow: none !important;
            }

            td span.inline-block,
            td span.rounded {
                border: none !important;
                padding: 0 !important;
                border-radius: 0 !important;
                font-weight: 600 !important;
            }

            .rounded-xl, .rounded-lg, .rounded-md {
                border-radius: 0 !important;
            }

            .fa-solid, .fa-regular {
                display: none !important;
            }

            body {
                display: block !important;
                min-height: 0 !important;
                height: auto !important;
            }

            main, #contentArea {
                display: block !important;
                overflow: visible !important;
                height: auto !important;
            }

            .table-wrap,
            .table-container {
                max-height: none !important;
                min-height: 0 !important;
                height: auto !important;
                overflow: visible !important;
                border-radius: 0 !important;
                border: none !important;
            }

            table {
                width: 100% !important;
                table-layout: fixed !important;
                font-size: 7.5pt !important;
                border-collapse: collapse !important;
                border-spacing: 0 !important;
            }

            thead {
                display: table-header-group !important;
            }

            tfoot {
                display: table-footer-group !important;
            }

            tbody {
                display: table-row-group !important;
            }

            tr {
                page-break-inside: avoid !important;
                break-inside: avoid !important;
            }

            thead tr th,
            th, td {
                position: static !important;
                top: auto !important;
                left: auto !important;
                padding: 3px 2px !important;
                min-width: 0 !important;
                word-wrap: break-word !important;
                overflow-wrap: break-word !important;
                box-shadow: none !important;
                border: 0.4pt solid #666 !important;
            }

            thead tr th {
                font-size: 7.5pt !important;
                font-weight: 700 !important;
                border-bottom: 1.2pt solid #000 !important;
            }

            td.month-cell {
                white-space: nowrap !important;
                font-size: 6.5pt !important;
                letter-spacing: -0.2px;
            }

            .sticky-col-1 {
                position: static !important;
                box-shadow: none !important;
            }
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-gradient-to-r from-blue-900 via-indigo-900 to-slate-900 text-white shadow-md no-print w-full">
        <div class="w-full px-4 sm:px-6 lg:px-8 py-5">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                <div>
                    <h1 class="text-2xl sm:text-3xl font-bold tracking-tight flex items-center gap-3">
                        <i class="fa-solid fa-coins text-yellow-400 text-3xl"></i>
                        ผลงานค่าบำเหน็จประจำปี
                    </h1>
                    <p class="text-blue-200 text-sm mt-1" id="subStatus">กำลังเตรียมข้อมูลระบบ...</p>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="loadData()" id="btnReload" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2 shadow-sm active:scale-95">
                        <i class="fa-solid fa-rotate" id="reloadIcon"></i>
                        <span>โหลดข้อมูลใหม่</span>
                    </button>
                    <button onclick="window.print()" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2 shadow-sm">
                        <i class="fa-solid fa-print"></i>
                        <span>พิมพ์รายงาน</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow w-full px-3 sm:px-6 lg:px-8 py-6">

        <!-- Loading State -->
        <div id="loadingState" class="bg-white rounded-xl shadow-sm p-12 text-center my-8 w-full border border-slate-200">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-blue-600 border-t-transparent mb-4"></div>
            <h3 class="text-lg font-medium text-slate-700">กำลังดึงข้อมูลเรียลไทม์จาก Google Sheets...</h3>
            <p class="text-slate-400 text-sm mt-1">กำลังประมวลผลชีต FYC, Bonus และ Manage</p>
        </div>

        <!-- Content Area -->
        <div id="contentArea" class="hidden space-y-6 w-full">

            <!-- Controls / Filters -->
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-4 no-print w-full">
                <div class="flex flex-col lg:flex-row gap-4 justify-between items-start lg:items-center">
                    
                    <!-- Segment Buttons (ระดับตำแหน่ง) -->
                    <div class="inline-flex p-1 bg-slate-100 rounded-xl border border-slate-200/80 w-full sm:w-auto overflow-x-auto" id="segGroup">
                        <button data-lv="ไตรมาส" class="seg-btn flex-1 sm:flex-none px-4 py-2 rounded-lg text-xs font-semibold transition-all duration-150 whitespace-nowrap bg-gradient-to-r from-blue-600 to-indigo-600 text-white shadow-sm">
                            <i class="fa-solid fa-calendar-check mr-1.5"></i>Summit Club
                        </button>
                        <button data-lv="ภาค" class="seg-btn flex-1 sm:flex-none px-4 py-2 rounded-lg text-xs font-semibold transition-all duration-150 whitespace-nowrap text-slate-600 hover:text-slate-900 hover:bg-slate-200/60">
                            <i class="fa-solid fa-sitemap mr-1.5"></i>โบนัสภาค
                        </button>
                        <button data-lv="ศูนย์" class="seg-btn flex-1 sm:flex-none px-4 py-2 rounded-lg text-xs font-semibold transition-all duration-150 whitespace-nowrap text-slate-600 hover:text-slate-900 hover:bg-slate-200/60">
                            <i class="fa-solid fa-building mr-1.5"></i>โบนัสศูนย์
                        </button>
                        <button data-lv="บริหาร" class="seg-btn flex-1 sm:flex-none px-4 py-2 rounded-lg text-xs font-semibold transition-all duration-150 whitespace-nowrap text-slate-600 hover:text-slate-900 hover:bg-slate-200/60">
                            <i class="fa-solid fa-chart-line mr-1.5"></i>ค่าบริหารเป้าหมายภาค
                        </button>
                    </div>

                    <!-- Search Input -->
                    <div class="relative w-full lg:w-80 flex-shrink-0">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="text" id="searchInput" oninput="if(state.fyc) render()" placeholder="ค้นหาชื่อ..." 
                               class="w-full pl-9 pr-4 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                    </div>
                </div>

                <!-- Tiers / Rates Filter Chips -->
                <div id="chipsWrap" class="pt-2 border-t border-slate-100">
                    <div id="chipsLabel" class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">ตัวกรองอัตราโบนัส / ขั้นผลงาน:</div>
                    <div class="flex flex-wrap gap-1.5" id="chipsContainer">
                        <!-- Dynamic Chips rendered here -->
                    </div>
                </div>
            </div>

            <!-- Table Container -->
            <div id="quarterSection" class="hidden space-y-6 w-full"></div>

            <div id="tableWrap" class="table-wrap bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden w-full">
                <div id="tableScrollContainer" class="overflow-x-auto overflow-y-auto table-container w-full">
                    <table class="w-full text-sm text-left text-slate-600 border-separate border-spacing-0" id="mainTable">
                        <thead class="text-xs text-slate-700 uppercase bg-slate-100" id="tableHead">
                            <!-- Dynamic Table Headers -->
                        </thead>
                        <tbody id="tableBody" class="divide-y divide-slate-200">
                            <!-- Dynamic Table Rows -->
                        </tbody>
                        <tfoot id="tableFoot" class="bg-slate-100 font-semibold text-slate-800">
                            <!-- Dynamic Table Footer -->
                        </tfoot>
                    </table>
                </div>
            </div>

            <!-- Summary Cards Grid (อยู่เหนือการ์ดเกณฑ์) -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 w-full" id="cardsGrid">
                <!-- Stat Cards Rendered Dynamically -->
            </div>

            <!-- Note Box for Region level (อยู่เหนือการ์ดเกณฑ์) -->
            <div id="noteBox" class="bg-amber-50 border border-amber-200 text-amber-900 p-4 rounded-xl text-sm flex items-start gap-3 shadow-sm hidden">
                <i class="fa-solid fa-triangle-exclamation text-amber-600 text-lg mt-0.5"></i>
                <div>
                    <span class="font-bold">หมายเหตุ (ระดับภาค):</span> หากสร้างหน่วยน้อยกว่า 3 หน่วยต่อปี จ่าย 50% ของโบนัสที่ได้
                </div>
            </div>

            <!-- Qualification Tier Rules Card -->
            <div id="tiersSection" class="w-full">
                <!-- Dynamic Tiers Table rendered here -->
            </div>

        </div>

    </main>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbzuEabtW0KQKIuQppvSF4D_JWAGz3oYP62UddfWW5aP6vUTqaDB0OYSokJvTi8VhTcY/exec';

        let state = {
            level: 'ไตรมาส',
            fyc: null,
            bonus: null,
            manage: null,
            manageErr: '',
            tier: null
        };

        const MONTHS = [
            ['มกราคม','มค','jan','january'],['กุมภาพันธ์','กพ','feb','february'],['มีนาคม','มีค','mar','march'],
            ['เมษายน','เมย','apr','april'],['พฤษภาคม','พค','may'],['มิถุนายน','มิย','jun','june'],
            ['กรกฎาคม','กค','jul','july'],['สิงหาคม','สค','aug','august'],['กันยายน','กย','sep','sept','september'],
            ['ตุลาคม','ตค','oct','october'],['พฤศจิกายน','พย','nov','november'],['ธันวาคม','ธค','dec','december']
        ];
        const MONTH_TH = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

        document.addEventListener("DOMContentLoaded", () => {
            setupEventListeners();
            loadData();
        });

        function setupEventListeners() {
            document.getElementById('segGroup').addEventListener('click', (e) => {
                const btn = e.target.closest('button');
                if (!btn) return;
                state.level = btn.dataset.lv;
                state.tier = null;
                state.qInit = false; // กลับมาหน้าไตรมาสแล้วเริ่มที่ไตรมาสปัจจุบันใหม่

                document.querySelectorAll('.seg-btn').forEach(x => {
                    if (x === btn) {
                        x.className = "seg-btn flex-1 sm:flex-none px-4 py-2 rounded-lg text-xs font-semibold transition-all duration-150 whitespace-nowrap bg-gradient-to-r from-blue-600 to-indigo-600 text-white shadow-sm";
                    } else {
                        x.className = "seg-btn flex-1 sm:flex-none px-4 py-2 rounded-lg text-xs font-semibold transition-all duration-150 whitespace-nowrap text-slate-600 hover:text-slate-900 hover:bg-slate-200/60";
                    }
                });

                if (state.fyc) render();
            });

            document.getElementById('chipsContainer').addEventListener('click', (e) => {
                const b = e.target.closest('button');
                if (!b) return;
                state.tier = b.dataset.t === '' ? null : b.dataset.t;
                if (state.fyc) render();
            });
        }

        function num(v) {
            if (typeof v === 'number') return isFinite(v) ? v : 0;
            if (v == null) return 0;
            const n = parseFloat(String(v).replace(/[,\s฿]/g, ''));
            return isFinite(n) ? n : 0;
        }

        function fmt(n) {
            if (!n || n === 0) return "0";
            return Math.round(n).toLocaleString('en-US');
        }

        function norm(s) {
            return String(s == null ? '' : s).replace(/[\s.]/g, '').toLowerCase();
        }

        function monthOf(h) {
            if (h instanceof Date) return h.getMonth();
            const raw = String(h == null ? '' : h).trim();
            const iso = raw.match(/^(\d{4})-(\d{2})-\d{2}T/);
            if (iso) return parseInt(iso[2], 10) - 1;
            const s = norm(raw);
            if (!s) return -1;
            if (/^(รวม|สะสม|total|sum|yfc)/.test(s)) return -1;
            for (let i = 0; i < 12; i++) {
                for (let j = 0; j < MONTHS[i].length; j++) {
                    if (s === MONTHS[i][j] || (s.indexOf(MONTHS[i][j]) === 0 && s.length <= MONTHS[i][j].length + 6)) return i;
                }
            }
            const m = s.match(/^(?:เดือน|m|month)?0?(\d{1,2})$/);
            if (m) {
                const n = parseInt(m[1], 10);
                if (n >= 1 && n <= 12) return n - 1;
            }
            return -1;
        }

        function colIdx(headers, keys) {
            for (let i = 0; i < headers.length; i++) {
                const h = norm(headers[i]);
                for (let k = 0; k < keys.length; k++) {
                    if (h === norm(keys[k]) || h.indexOf(norm(keys[k])) === 0) return i;
                }
            }
            return -1;
        }

        function parseFYC(d) {
            const H = d.headers || [], R = d.rows || [];
            const iName = colIdx(H, ['ชื่อ-สกุล', 'ชื่อ']);
            const iPos = colIdx(H, ['ตำแหน่ง']);
            const iReg = colIdx(H, ['ภาค']);
            const iCen = colIdx(H, ['ศูนย์']);
            const iUnit = colIdx(H, ['หน่วย']);
            const iCode = colIdx(H, ['รหัส']);

            if (iPos < 0) throw new Error('ชีต FYC ไม่พบคอลัมน์ "ตำแหน่ง"');
            const used = {};
            [iName, iPos, iReg, iCen, iUnit, iCode].forEach(i => { if (i >= 0) used[i] = 1; });

            const mcols = [];
            for (let c = 0; c < H.length; c++) {
                if (used[c]) continue;
                const m = monthOf(H[c]);
                if (m >= 0) mcols.push({ idx: c, m: m, label: MONTH_TH[m] });
            }
            if (!mcols.length) {
                for (let c2 = 0; c2 < H.length; c2++) {
                    if (used[c2]) continue;
                    const s = norm(H[c2]);
                    if (!s || /^(รวม|สะสม|total|sum)/.test(s)) continue;
                    mcols.push({ idx: c2, m: c2, label: String(H[c2]) });
                }
            }
            mcols.sort((a, b) => a.m - b.m);

            const rows = [];
            R.forEach(r => {
                const pos = String(r[iPos] == null ? '' : r[iPos]).trim();
                if (pos !== 'ภาค' && pos !== 'ศูนย์') return;
                rows.push({
                    pos: pos,
                    name: iName >= 0 ? String(r[iName] || '').trim() : '',
                    code: iCode >= 0 ? String(r[iCode] || '').trim() : '',
                    region: iReg >= 0 ? String(r[iReg] || '').trim() : '',
                    center: iCen >= 0 ? String(r[iCen] || '').trim() : '',
                    vals: mcols.map(mc => num(r[mc.idx]))
                });
            });
            return { mcols, rows };
        }

        function parseBonus(d) {
            const H = d.headers || [], R = d.rows || [];
            const iPos = colIdx(H, ['ตำแหน่ง']), iF = colIdx(H, ['FYC']), iB = colIdx(H, ['Bonus', 'โบนัส']);
            if (iPos < 0 || iF < 0 || iB < 0) throw new Error('ชีต Bonus ต้องมีคอลัมน์ ตำแหน่ง / FYC / Bonus');
            const t = {};
            R.forEach(r => {
                const pos = String(r[iPos] || '').trim();
                if (!pos) return;
                const raw = r[iB];
                let p = 0;
                if (typeof raw === 'string' && raw.indexOf('%') >= 0) p = num(raw.replace('%', '')) / 100;
                else { p = num(raw); if (p > 1) p = p / 100; }
                (t[pos] = t[pos] || []).push({ fyc: num(r[iF]), pct: p });
            });
            Object.keys(t).forEach(k => { t[k].sort((a, b) => a.fyc - b.fyc); });
            return t;
        }

        function parseManage(d) {
            const H = d.headers || [], R = d.rows || [];
            const iF = colIdx(H, ['FYC']), iA = colIdx(H, ['ค่าบริหาร']);
            if (iF < 0 || iA < 0) throw new Error('ชีต Manage ต้องมีคอลัมน์ FYC / ค่าบริหารเป้าหมายภาค');
            const t = [];
            R.forEach(r => {
                if (r[iF] === '' || r[iF] == null) return;
                t.push({ fyc: num(r[iF]), amt: num(r[iA]) });
            });
            t.sort((a, b) => a.fyc - b.fyc);
            return t;
        }

        function tierFor(tiers, cum) {
            let cur = { fyc: 0, pct: 0, amt: 0 }, next = null;
            for (let i = 0; i < tiers.length; i++) {
                if (cum >= tiers[i].fyc) cur = tiers[i];
                else { next = tiers[i]; break; }
            }
            return { cur, next };
        }

        function build(level) {
            const f = state.fyc, n = f.mcols.length, out = {};
            f.rows.forEach(r => {
                if (r.pos !== level || !r.name) return;
                const key = r.name + '|' + r.code;
                const o = out[key] = out[key] || { name: r.name, code: r.code, vals: new Array(n).fill(0) };
                r.vals.forEach((v, i) => { o.vals[i] += v; });
            });
            return Object.keys(out).map(k => out[k]);
        }

        function fetchSheetData(sheet) {
            const url = API_URL + (API_URL.indexOf('?') >= 0 ? '&' : '?') + 'sheet=' + encodeURIComponent(sheet) + '&_=' + Date.now();
            return fetch(url)
                .then(r => r.json())
                .then(d => {
                    if (d.error) throw new Error(d.error);
                    if (!d.headers) throw new Error(`ชีต ${sheet} ไม่มีข้อมูล`);
                    return d;
                });
        }

        async function loadData() {
            showLoading(true);
            document.getElementById('subStatus').textContent = 'กำลังโหลดข้อมูลจาก Google Sheets...';

            try {
                const pManage = fetchSheetData('Manage')
                    .then(d => { state.manage = parseManage(d); state.manageErr = ''; })
                    .catch(e => { state.manage = null; state.manageErr = e.message; });

                const [fycData, bonusData] = await Promise.all([
                    fetchSheetData('FYC'),
                    fetchSheetData('Bonus'),
                    pManage
                ]);

                state.fyc = parseFYC(fycData);
                state.bonus = parseBonus(bonusData);

                document.getElementById('subStatus').textContent = 'รายงานสรุปผลงานค่าบำเหน็จและโบนัส';
                showLoading(false);
                render();
            } catch (err) {
                console.error(err);
                document.getElementById('subStatus').innerHTML = `<span class="text-red-300">โหลดข้อมูลไม่สำเร็จ: ${esc(err.message)}</span>`;
                showLoading(false);
                alert("เกิดข้อผิดพลาดในการโหลดข้อมูล: " + err.message);
            }
        }

        const QUARTER_TARGET = { 'ภาค': 300000, 'ศูนย์': 60000 };
        const SUMMIT_TARGET = { 'ภาค': 1000000, 'ศูนย์': 250000 };

        function renderQuarter() {
            const f = state.fyc;
            const sec = document.getElementById('quarterSection');
            const q = norm(document.getElementById('searchInput').value);

            // ไตรมาส -> คอลัมน์เดือนใน FYC / เดือนที่มีข้อมูลจริง
            const qCols = [[], [], [], []];
            const qMonths = [new Set(), new Set(), new Set(), new Set()];
            f.mcols.forEach((mc, i) => {
                if (mc.m < 0 || mc.m > 11) return;
                const qi = Math.floor(mc.m / 3);
                qCols[qi].push(i);
                let tot = 0;
                f.rows.forEach(r => { tot += r.vals[i]; });
                if (tot !== 0) qMonths[qi].add(mc.m);
            });
            const allActiveQ = [0, 1, 2, 3].filter(qi => qMonths[qi].size > 0);

            if (!allActiveQ.length) {
                document.getElementById('chipsContainer').innerHTML = '';
                sec.innerHTML = '<div class="bg-white rounded-xl border border-slate-200 p-12 text-center text-slate-400">ยังไม่มีข้อมูลผลงาน</div>';
                return;
            }

            // เริ่มที่ไตรมาสปัจจุบัน (ถ้าไตรมาสนั้นยังไม่มีข้อมูล ใช้ไตรมาสล่าสุดที่มีข้อมูลก่อนหน้า)
            if (!state.qInit) {
                state.qInit = true;
                const curQ = Math.floor(new Date().getMonth() / 3);
                let pick = null;
                for (let qi = curQ; qi >= 0; qi--) {
                    if (allActiveQ.includes(qi)) { pick = qi; break; }
                }
                if (pick === null) pick = allActiveQ[allActiveQ.length - 1];
                state.tier = String(pick);
            }

            // ปุ่มย่อยเลือกไตรมาส (ใช้ state.tier เก็บเลขไตรมาส 0-3)
            if (state.tier !== null && !allActiveQ.includes(parseInt(state.tier, 10))) state.tier = null;
            const activeQ = state.tier !== null ? [parseInt(state.tier, 10)] : allActiveQ;
            // เมื่อเลือกไตรมาสเดียว แสดงผลงานรายเดือนที่มีข้อมูลในไตรมาสนั้น
            const monthIdx = state.tier !== null ? qCols[activeQ[0]].filter(i => qMonths[activeQ[0]].has(f.mcols[i].m)) : [];
            const chipCls = sel => `px-3 py-1.5 rounded-lg text-xs font-semibold transition-all duration-150 flex items-center gap-1.5 cursor-pointer select-none border ${sel ? 'bg-gradient-to-r from-blue-600 to-indigo-600 text-white border-blue-600 shadow-sm' : 'bg-slate-100 text-slate-600 border-slate-200/80 hover:bg-slate-200/80'}`;
            const badgeCls = sel => `${sel ? 'bg-white/25 text-white' : 'bg-slate-200 text-slate-600'} px-1.5 py-0.5 rounded-full text-[10px] font-bold`;
            let qChips = `<button data-t="" class="${chipCls(state.tier === null)}"><span>ทุกไตรมาส</span><span class="${badgeCls(state.tier === null)}">${allActiveQ.length}</span></button>`;
            allActiveQ.forEach(qi => {
                const sel = state.tier === String(qi);
                qChips += `<button data-t="${qi}" class="${chipCls(sel)}"><span>ไตรมาส ${qi + 1}</span><span class="${badgeCls(sel)}">${qMonths[qi].size}/3 เดือน</span></button>`;
            });
            document.getElementById('chipsContainer').innerHTML = qChips;

            const qLabel = qi => {
                const ms = Array.from(qMonths[qi]).sort((a, b) => a - b).map(m => MONTH_TH[m]);
                const full = qMonths[qi].size >= 3;
                return { full, text: full ? 'ครบ 3 เดือน' : `ข้อมูล ${qMonths[qi].size}/3 เดือน (${ms.join(', ')})` };
            };

            let html = '';
            ['ภาค', 'ศูนย์'].forEach(pos => {
                const target = QUARTER_TARGET[pos];
                const summit = SUMMIT_TARGET[pos];
                let list = build(pos).map(o => {
                    o.qv = [0, 1, 2, 3].map(qi => qCols[qi].reduce((s, i) => s + o.vals[i], 0));
                    o.total = o.qv.reduce((a, b) => a + b, 0);
                    o.passCount = activeQ.filter(qi => o.qv[qi] >= target).length;
                    return o;
                });
                const allCount = list.length;
                if (q) list = list.filter(o => norm(o.name).indexOf(q) >= 0);
                // เลือกไตรมาสเดียว: เรียงตามผลงานไตรมาสนั้น / ทุกไตรมาส: เรียงตามสะสมรวม
                if (state.tier !== null) {
                    const sq = activeQ[0];
                    list.sort((a, b) => b.qv[sq] - a.qv[sq]);
                } else {
                    list.sort((a, b) => b.total - a.total);
                }

                // สรุปรายไตรมาส
                let sumCards = '';
                activeQ.forEach(qi => {
                    const passN = list.filter(o => o.qv[qi] >= target).length;
                    const summitN = list.filter(o => o.qv[qi] >= summit).length;
                    const sumV = list.reduce((s, o) => s + o.qv[qi], 0);
                    const lb = qLabel(qi);
                    sumCards += `
                        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                            <div class="flex items-center justify-between mb-1">
                                <span class="text-slate-700 text-sm font-bold">ไตรมาส ${qi + 1}</span>
                                <span class="text-[10px] px-2 py-0.5 rounded-full ${lb.full ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">${lb.full ? 'ครบไตรมาส' : 'ยังไม่ครบ'}</span>
                            </div>
                            <div class="text-xs text-slate-400 mb-2">${esc(lb.text)}</div>
                            <div class="text-xl font-bold text-blue-700 font-mono">${fmt(sumV)} <span class="text-xs font-normal text-slate-500">บาท</span></div>
                            <div class="text-xs mt-1 text-slate-600">ผ่านเกณฑ์ <b class="text-emerald-600">${passN}</b> / ${list.length} ราย</div>
                            <div class="text-xs mt-0.5 text-slate-600">Summit ${pos} <b class="text-purple-600">${summitN}</b> ราย</div>
                        </div>`;
                });

                // หัวตาราง
                let th = `<tr>
                    <th class="px-4 py-3.5 min-w-[180px] sticky-col-1 bg-slate-100 border-b border-r border-slate-200 text-left">${pos}</th>`;
                activeQ.forEach(qi => {
                    const lb = qLabel(qi);
                    th += `<th class="px-3 py-3.5 text-right min-w-[130px] border-b border-slate-200">ไตรมาส ${qi + 1}<div class="normal-case font-normal text-[10px] ${lb.full ? 'text-slate-400' : 'text-amber-600'}">${lb.full ? 'ครบ 3 เดือน' : esc(qMonths[qi].size + '/3 เดือน')}</div></th>`;
                });
                const showTotal = state.tier === null; // เลือกไตรมาสเดียว ไม่ต้องมีคอลัมน์สะสมรวม
                th += `<th class="px-3 py-3.5 text-center min-w-[100px] border-b border-slate-200">ไตรมาสที่ผ่าน</th>`;
                if (showTotal) th += `<th class="px-4 py-3.5 text-right min-w-[110px] bg-slate-200/80 font-bold border-b border-slate-200">สะสมรวม</th>`;
                monthIdx.forEach(i => {
                    th += `<th class="px-3 py-3.5 text-right min-w-[95px] border-b border-slate-200">${esc(f.mcols[i].label)}</th>`;
                });
                th += `</tr>`;

                // เนื้อตาราง
                let tb = '';
                list.forEach((o, idx) => {
                    const bg = idx % 2 === 0 ? 'bg-white hover:bg-blue-50/30' : 'bg-slate-50/60 hover:bg-blue-50/40';
                    const sbg = idx % 2 === 0 ? 'bg-white' : 'bg-slate-50';
                    tb += `<tr class="${bg} transition-colors">
                        <td class="px-4 py-3 sticky-col-1 ${sbg} font-semibold text-slate-900 border-r border-slate-200">${esc(o.name)}</td>`;
                    activeQ.forEach(qi => {
                        const v = o.qv[qi];
                        const ok = v >= target;
                        const status = ok
                            ? '<span class="text-[11px] text-emerald-600 font-semibold"><i class="fa-solid fa-circle-check"></i> ผ่านเกณฑ์</span>'
                            : `<span class="text-[11px] text-rose-500">ขาดอีก ${fmt(target - v)}</span>`;
                        const summitBadge = v >= summit
                            ? `<div><span class="inline-block mt-0.5 px-2 py-0.5 text-[11px] rounded-full border bg-purple-100 text-purple-700 border-purple-200 font-bold"><i class="fa-solid fa-mountain mr-1"></i>Summit ${pos}</span></div>`
                            : '';
                        tb += `<td class="px-3 py-2.5 text-right border-l border-slate-100">
                            <div class="font-mono font-semibold ${ok ? 'text-emerald-700' : 'text-slate-800'}">${fmt(v)}</div>${status}${summitBadge}</td>`;
                    });
                    tb += `<td class="px-3 py-3 text-center"><span class="inline-block px-2.5 py-0.5 text-xs rounded-full border ${o.passCount > 0 ? 'bg-blue-100 text-blue-800 border-blue-200 font-bold' : 'bg-slate-100 text-slate-500 border-slate-200'}">${o.passCount}/${activeQ.length}</span></td>`;
                    if (showTotal) tb += `<td class="px-4 py-3 text-right bg-slate-100/60 border-l border-slate-200 font-bold font-mono text-slate-900">${fmt(o.total)}</td>`;
                    monthIdx.forEach(i => {
                        tb += `<td class="px-3 py-3 text-right border-l border-slate-100 font-mono text-xs">${fmt(o.vals[i])}</td>`;
                    });
                    tb += `</tr>`;
                });
                if (!list.length) {
                    tb = `<tr><td colspan="100%" class="py-8 text-center text-slate-400">ไม่พบข้อมูลที่ตรงกับเงื่อนไข</td></tr>`;
                }

                // ท้ายตาราง
                let tf = `<tr><td class="px-4 py-3 sticky-col-1 bg-slate-100 font-bold border-r border-slate-200 text-slate-900">รวมทั้งหมด</td>`;
                activeQ.forEach(qi => {
                    tf += `<td class="px-3 py-3 text-right font-mono font-bold text-slate-800">${fmt(list.reduce((s, o) => s + o.qv[qi], 0))}</td>`;
                });
                tf += `<td></td>`;
                if (showTotal) tf += `<td class="px-4 py-3 text-right font-bold font-mono text-blue-900 bg-slate-200/80">${fmt(list.reduce((s, o) => s + o.total, 0))}</td>`;
                monthIdx.forEach(i => {
                    tf += `<td class="px-3 py-3 text-right font-mono text-xs font-bold text-slate-800">${fmt(list.reduce((s, o) => s + o.vals[i], 0))}</td>`;
                });
                tf += `</tr>`;

                html += `
                <div class="space-y-4">
                    <div class="flex flex-wrap items-center gap-3">
                        <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                            <i class="fa-solid ${pos === 'ภาค' ? 'fa-sitemap' : 'fa-building'} text-blue-600"></i>
                            ผลงานไตรมาส ระดับ${pos}
                        </h2>
                        <span class="text-xs bg-blue-50 text-blue-700 border border-blue-200 px-3 py-1 rounded-full font-semibold">เกณฑ์ผ่าน: ตั้งแต่ ${fmt(target)} บาท/ไตรมาส</span>
                        <span class="text-xs bg-purple-50 text-purple-700 border border-purple-200 px-3 py-1 rounded-full font-semibold">Summit ${pos}: ตั้งแต่ ${fmt(summit)} บาท/ไตรมาส</span>
                        <span class="text-xs text-slate-400">ทั้งหมด ${allCount} ราย</span>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">${sumCards}</div>
                    <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden w-full">
                        <div class="overflow-x-auto w-full">
                            <table class="w-full text-sm text-left text-slate-600 border-separate border-spacing-0">
                                <thead class="text-xs text-slate-700 uppercase bg-slate-100">${th}</thead>
                                <tbody class="divide-y divide-slate-200">${tb}</tbody>
                                <tfoot class="bg-slate-100 font-semibold text-slate-800">${tf}</tfoot>
                            </table>
                        </div>
                    </div>
                </div>`;
            });
            sec.innerHTML = html;
        }

        function render() {
            const lv = state.level;
            const isQ = (lv === 'ไตรมาส');
            document.getElementById('quarterSection').classList.toggle('hidden', !isQ);
            document.getElementById('tableWrap').classList.toggle('hidden', isQ);
            document.getElementById('chipsLabel').textContent = isQ ? 'เลือกดูตามไตรมาส:' : 'ตัวกรองอัตราโบนัส / ขั้นผลงาน:';
            document.getElementById('tiersSection').classList.toggle('hidden', isQ);
            document.getElementById('cardsGrid').classList.toggle('hidden', isQ);
            if (isQ) {
                document.getElementById('noteBox').classList.add('hidden');
                renderQuarter();
                return;
            }
            const isMg = (lv === 'บริหาร');
            const dl = isMg ? 'ภาค' : lv;
            const f = state.fyc;

            if (isMg && !state.manage) {
                document.getElementById('chipsContainer').innerHTML = '';
                document.getElementById('cardsGrid').innerHTML = '';
                document.getElementById('noteBox').classList.add('hidden');
                document.getElementById('tiersSection').innerHTML = '';
                document.getElementById('tableHead').innerHTML = '';
                document.getElementById('tableBody').innerHTML = `<tr><td colspan="100%" class="py-8 text-center text-rose-500 font-semibold">โหลดชีต Manage ไม่สำเร็จ: ${esc(state.manageErr)}</td></tr>`;
                document.getElementById('tableFoot').innerHTML = '';
                return;
            }

            const tiers = isMg ? state.manage : (state.bonus[dl] || []);
            let list = build(dl);

            const showMonths = [];
            f.mcols.forEach((mc, i) => {
                let tot = 0;
                list.forEach(o => { tot += o.vals[i]; });
                if (tot !== 0) showMonths.push(i);
            });

            const pk = p => p.toFixed(4);
            list.forEach(o => {
                o.cum = o.vals.reduce((a, b) => a + b, 0);
                const t = tierFor(tiers, o.cum);
                o.next = t.next;
                if (isMg) {
                    o.amt = t.cur.amt;
                    o.bonus = o.amt;
                    o.key = String(o.amt);
                } else {
                    o.pct = t.cur.pct;
                    o.bonus = o.cum * o.pct;
                    o.key = pk(o.pct);
                }
            });

            const q = norm(document.getElementById('searchInput').value);
            if (q) list = list.filter(o => norm(o.name).indexOf(q) >= 0);
            list.sort((a, b) => b.cum - a.cum);

            // Render Filter Chips
            const seen = {}, opts = [];
            tiers.forEach(t => {
                const v = isMg ? t.amt : t.pct;
                const k = isMg ? String(v) : pk(v);
                if (!seen[k]) { seen[k] = 1; opts.push({ k, v }); }
            });
            opts.sort((a, b) => a.v - b.v);

            const cnt = {}, sumB = {};
            list.forEach(o => {
                cnt[o.key] = (cnt[o.key] || 0) + 1;
                sumB[o.key] = (sumB[o.key] || 0) + o.bonus;
            });

            let chipsHTML = `
                <button data-t="" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition-all duration-150 flex items-center gap-1.5 cursor-pointer select-none border ${state.tier === null ? 'bg-gradient-to-r from-blue-600 to-indigo-600 text-white border-blue-600 shadow-sm' : 'bg-slate-100 text-slate-600 border-slate-200/80 hover:bg-slate-200/80'}">
                    <span>ทั้งหมด</span>
                    <span class="${state.tier === null ? 'bg-white/25 text-white' : 'bg-slate-200 text-slate-600'} px-1.5 py-0.5 rounded-full text-[10px] font-bold">${list.length}</span>
                </button>
            `;

            opts.forEach(p => {
                const c = cnt[p.k] || 0;
                const label = isMg ? `ค่าบริหาร ${fmt(p.v)}` : `โบนัส ${(p.v * 100).toFixed(1)}%`;
                const isSelected = state.tier === p.k;
                chipsHTML += `
                    <button data-t="${p.k}" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition-all duration-150 flex items-center gap-1.5 cursor-pointer select-none border ${c === 0 ? 'opacity-40' : ''} ${isSelected ? 'bg-gradient-to-r from-blue-600 to-indigo-600 text-white border-blue-600 shadow-sm' : 'bg-slate-100 text-slate-600 border-slate-200/80 hover:bg-slate-200/80'}">
                        <span>${label}</span>
                        <span class="${isSelected ? 'bg-white/25 text-white' : 'bg-slate-200 text-slate-600'} px-1.5 py-0.5 rounded-full text-[10px] font-bold">${c}</span>
                    </button>
                `;
            });
            document.getElementById('chipsContainer').innerHTML = chipsHTML;

            if (state.tier !== null) {
                list = list.filter(o => o.key === state.tier);
            }

            // Show Note Box for Region
            const isRegion = (lv === 'ภาค');
            document.getElementById('noteBox').classList.toggle('hidden', !isRegion);

            // Render Stat Cards
            let totCum = 0, totBonus = 0;
            list.forEach(o => { totCum += o.cum; totBonus += o.bonus; });
            const lastMonthLabel = showMonths.length ? f.mcols[showMonths[showMonths.length - 1]].label : '-';

            let cardsHTML = `
                <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                    <div class="text-slate-500 text-xs font-semibold uppercase tracking-wider mb-1">จำนวน${dl}ทั้งหมด</div>
                    <div class="text-2xl font-bold text-slate-900">${list.length.toLocaleString()} <span class="text-sm font-normal text-slate-500">หน่วย</span></div>
                    <div class="text-xs text-slate-400 mt-1">ข้อมูลล่าสุด: ${lastMonthLabel}</div>
                </div>
                <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                    <div class="text-slate-500 text-xs font-semibold uppercase tracking-wider mb-1">ค่าบำเหน็จสะสมรวม</div>
                    <div class="text-2xl font-bold text-blue-700">${fmt(totCum)} <span class="text-sm font-normal text-slate-500">บาท</span></div>
                    <div class="text-xs text-slate-400 mt-1">ยอดคำนวณสะสมปีนี้</div>
                </div>
                <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                    <div class="text-slate-500 text-xs font-semibold uppercase tracking-wider mb-1">${isMg ? 'ค่าบริหารเป้าหมายรวม' : 'โบนัสรวม ' + (isRegion ? '(100%)' : '')}</div>
                    <div class="text-2xl font-bold text-emerald-600">${fmt(totBonus)} <span class="text-sm font-normal text-slate-500">บาท</span></div>
                    <div class="text-xs text-slate-400 mt-1">คำนวณตามอัตราขั้นผลงาน</div>
                </div>
            `;

            if (isRegion) {
                cardsHTML += `
                    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                        <div class="text-slate-500 text-xs font-semibold uppercase tracking-wider mb-1">โบนัสรวม (กรณีจ่าย 50%)</div>
                        <div class="text-2xl font-bold text-amber-600">${fmt(totBonus / 2)} <span class="text-sm font-normal text-slate-500">บาท</span></div>
                        <div class="text-xs text-slate-400 mt-1">กรณีสร้างหน่วยน้อยกว่า 3 หน่วย</div>
                    </div>
                `;
            }

            document.getElementById('cardsGrid').innerHTML = cardsHTML;

            if (!list.length) {
                document.getElementById('tableHead').innerHTML = '';
                document.getElementById('tableBody').innerHTML = `
                    <tr>
                        <td colspan="100%" class="py-12 text-center text-slate-400">
                            <i class="fa-regular fa-folder-open text-4xl mb-3 block opacity-60"></i>
                            ไม่พบข้อมูลที่ตรงกับเงื่อนไข
                        </td>
                    </tr>`;
                document.getElementById('tableFoot').innerHTML = '';
                renderTiersTable();
                return;
            }

            // Render Table Header (Reordered: Month columns moved to the end)
            let thHTML = `
                <tr>
                    <th class="px-4 py-3.5 min-w-[180px] sticky-col-1 bg-slate-100 border-b border-r border-slate-200 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.05)] text-left">${dl}</th>
                    <th class="px-4 py-3.5 text-right min-w-[110px] bg-slate-200/80 font-bold border-b border-slate-200">สะสมรวม</th>
                    ${isMg ? '<th class="px-4 py-3.5 text-right min-w-[110px] border-b border-slate-200">ค่าบริหาร</th>' : '<th class="px-3 py-3.5 text-center min-w-[90px] border-b border-slate-200">%โบนัส</th><th class="px-4 py-3.5 text-right min-w-[110px] border-b border-slate-200">โบนัส</th>'}
                    ${isRegion ? '<th class="px-4 py-3.5 text-right min-w-[120px] border-b border-slate-200 text-amber-700">จ่าย 50%</th>' : ''}
                    <th class="px-4 py-3.5 text-left min-w-[170px] border-b border-slate-200">ขั้นถัดไป</th>
            `;
            showMonths.forEach(i => {
                thHTML += `<th class="px-3 py-3.5 text-right border-b border-slate-200 min-w-[85px]">${esc(f.mcols[i].label)}</th>`;
            });
            thHTML += `</tr>`;
            document.getElementById('tableHead').innerHTML = thHTML;

            // Render Table Body
            let tbodyHTML = '';
            list.forEach((o, index) => {
                const rowBg = index % 2 === 0 ? "bg-white hover:bg-blue-50/30" : "bg-slate-50/60 hover:bg-blue-50/40";
                const stickyBg = index % 2 === 0 ? "bg-white" : "bg-slate-50";

                tbodyHTML += `<tr class="${rowBg} transition-colors">`;
                tbodyHTML += `<td class="px-4 py-3 sticky-col-1 ${stickyBg} font-semibold text-slate-900 border-r border-slate-200 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.05)]">${esc(o.name)}</td>`;

                tbodyHTML += `<td class="px-4 py-3 text-right bg-slate-100/60 border-l border-slate-200 font-bold font-mono text-slate-900">${fmt(o.cum)}</td>`;

                if (isMg) {
                    tbodyHTML += `<td class="px-4 py-3 text-right font-bold text-emerald-600 font-mono">${fmt(o.bonus)}</td>`;
                } else {
                    const badgeClass = o.pct > 0 ? "bg-blue-100 text-blue-800 border-blue-200 font-bold" : "bg-slate-100 text-slate-500 border-slate-200";
                    tbodyHTML += `<td class="px-3 py-3 text-center"><span class="inline-block px-2.5 py-0.5 text-xs rounded-full border ${badgeClass}">${(o.pct * 100).toFixed(1)}%</span></td>`;
                    tbodyHTML += `<td class="px-4 py-3 text-right font-bold text-emerald-600 font-mono">${fmt(o.bonus)}</td>`;
                }

                if (isRegion) {
                    tbodyHTML += `<td class="px-4 py-3 text-right font-medium text-amber-600 font-mono">${fmt(o.bonus / 2)}</td>`;
                }

                let nx = '<span class="text-xs text-emerald-600 font-medium"><i class="fa-solid fa-circle-check"></i> ขั้นสูงสุดแล้ว</span>';
                if (o.next) {
                    const diff = o.next.fyc - o.cum;
                    const nextValLabel = isMg ? fmt(o.next.amt) : (o.next.pct * 100).toFixed(1) + '%';
                    nx = `<span class="text-xs text-slate-500">เพิ่ม <b class="text-slate-800 font-mono">${fmt(diff)}</b> รับ <b class="text-blue-600 font-semibold">${nextValLabel}</b></span>`;
                }

                tbodyHTML += `<td class="px-4 py-3">${nx}</td>`;

                showMonths.forEach(i => {
                    tbodyHTML += `<td class="px-3 py-2.5 text-right border-l border-slate-100 font-mono text-xs">${fmt(o.vals[i])}</td>`;
                });

                tbodyHTML += `</tr>`;
            });
            document.getElementById('tableBody').innerHTML = tbodyHTML;

            // Render Table Footer
            let tfootHTML = `
                <tr>
                    <td class="px-4 py-3 sticky-col-1 bg-slate-100 font-bold border-r border-slate-200 text-slate-900">รวมทั้งหมด</td>
                    <td class="px-4 py-3 text-right font-bold font-mono text-blue-900 bg-slate-200/80">${fmt(totCum)}</td>
                    ${!isMg ? '<td></td>' : ''}
                    <td class="px-4 py-3 text-right font-bold font-mono text-emerald-700">${fmt(totBonus)}</td>
                    ${isRegion ? `<td class="px-4 py-3 text-right font-bold font-mono text-amber-700">${fmt(totBonus / 2)}</td>` : ''}
                    <td></td>
            `;
            showMonths.forEach(i => {
                let s = 0;
                list.forEach(o => { s += o.vals[i]; });
                tfootHTML += `<td class="px-3 py-3 text-right font-mono text-xs font-bold text-slate-800">${fmt(s)}</td>`;
            });
            tfootHTML += `</tr>`;
            document.getElementById('tableFoot').innerHTML = tfootHTML;

            renderTiersTable();
        }

        function renderTiersTable() {
            const isMg = state.level === 'บริหาร';
            const tiers = isMg ? (state.manage || []) : (state.bonus[state.level] || []);
            const container = document.getElementById('tiersSection');

            if (!tiers.length) {
                container.innerHTML = '';
                return;
            }

            const title = isMg ? 'เกณฑ์ค่าบริหารเป้าหมายภาค' : `เกณฑ์โบนัส ระดับ${esc(state.level)}`;
            let html = `
                <div class="bg-white rounded-xl border border-slate-200 p-5 shadow-sm max-w-xl">
                    <h3 class="text-base font-bold text-slate-800 mb-3 flex items-center gap-2">
                        <i class="fa-solid fa-list-check text-blue-600"></i>
                        ${title}
                    </h3>
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-50 text-slate-600 text-xs uppercase border-b border-slate-200">
                                    <th class="py-2 px-3 text-left font-semibold">ค่าบำเหน็จรวมทั้งปี (FYC)</th>
                                    <th class="py-2 px-3 text-right font-semibold">${isMg ? 'ค่าบริหารเป้าหมาย' : 'อัตราโบนัส'}</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100">
            `;

            tiers.forEach(t => {
                html += `
                    <tr class="hover:bg-slate-50/50">
                        <td class="py-2 px-3 font-mono text-slate-700">${fmt(t.fyc)} บาทขึ้นไป</td>
                        <td class="py-2 px-3 text-right font-bold ${isMg ? 'text-emerald-600' : 'text-blue-600'} font-mono">${isMg ? fmt(t.amt) + ' บาท' : (t.pct * 100).toFixed(1) + '%'}</td>
                    </tr>
                `;
            });

            html += `
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
            container.innerHTML = html;
        }

        function esc(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function showLoading(isLoading) {
            document.getElementById("loadingState").style.display = isLoading ? "block" : "none";
            document.getElementById("contentArea").style.display = isLoading ? "none" : "block";

            const reloadIcon = document.getElementById("reloadIcon");
            if (isLoading) reloadIcon.classList.add("fa-spin");
            else reloadIcon.classList.remove("fa-spin");
        }
    </script>
</body>
</html>
