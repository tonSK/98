<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>98 System</title>
    <!-- เพิ่ม Font Awesome CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #007AC2;
            --card-bg: #253487;
            --card-hover: #040D3D;
            --text-color: #f8fafc;
            --text-secondary: #F2F7F9;
            --accent-color: #9EC7E0;
            --accent-gradient: linear-gradient(135deg, #ffffff 0%, #ffffff 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(56, 189, 248, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(129, 140, 248, 0.1) 0%, transparent 40%);
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        header {
            text-align: center;
            margin-bottom: 10px;
            display: flex;
            flex-direction: row; /* เปลี่ยนให้เรียงเป็นแถวแนวนอน */
            align-items: center;
            justify-content: center; /* จัดให้อยู่กึ่งกลาง */
            gap: 16px; /* ระยะห่างระหว่างโลโก้กับข้อความ */
        }

        .logo-img {
            width: 70px; /* ปรับขนาดความกว้างโลโก้ให้พอดีกับบรรทัด */
            height: auto;
            object-fit: contain;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0; /* เอา margin ด้านล่างออกเพื่อให้จัดกึ่งกลางกับโลโก้ได้พอดี */
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .links-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 16px 24px;
            text-decoration: none;
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .link-card:hover {
            background: var(--card-hover);
            transform: translateY(-3px);
            border-color: rgba(56, 189, 248, 0.3);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 4px 6px -2px rgba(56, 189, 248, 0.05);
        }

        .link-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .icon-box {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: rgba(56, 189, 248, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-color);
            transition: all 0.3s ease;
        }

        .link-card:hover .icon-box {
            background: var(--accent-color);
            color: #0f172a;
            transform: scale(1.05);
        }

        .icon-box i {
            font-size: 1.15rem;
        }

        .link-title {
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .link-arrow {
            color: var(--text-secondary);
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .link-card:hover .link-arrow {
            color: var(--accent-color);
            transform: translateX(4px);
        }

        footer {
            margin-top: 30px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <img src="https://i.postimg.cc/Bb24tRpx/Logo98New-Wh.png" alt="98 System Logo" class="logo-img">
            <h1>System</h1>
        </header>

        <div class="links-grid">
            <!-- Lotto (ใช้ไอคอนตั๋ว/สลาก) -->
            <a href="https://script.google.com/macros/s/AKfycbw1q38aIle8gOas1Eaui3wbpaB4jWirqZGq74qxcpFObBa40Kj2p2Hlb5C-8KXIZjDA/exec" class="link-card" target="_blank">
                <div class="link-left">
                    <div class="icon-box">
                        <i class="fa-solid fa-ticket"></i>
                    </div>
                    <span class="link-title">Lotto</span>
                </div>
                <span class="link-arrow">➔</span>
            </a>

            <!-- Random (ใช้ไอคอนสุ่มลูกเต๋า) -->
            <a href="https://luck98.vercel.app" class="link-card" target="_blank">
                <div class="link-left">
                    <div class="icon-box">
                        <i class="fa-solid fa-dice"></i>
                    </div>
                    <span class="link-title">Lucky Draw</span>
                </div>
                <span class="link-arrow">➔</span>
            </a>

            <!-- Report (ใช้ไอคอนรายงาน) -->
            <a href="https://tonsk.github.io/98/report" class="link-card" target="_blank">
                <div class="link-left">
                    <div class="icon-box">
                        <i class="fa-solid fa-file-lines"></i>
                    </div>
                    <span class="link-title">Report</span>
                </div>
                <span class="link-arrow">➔</span>
            </a>

            <!-- Commission (ใช้ไอคอนเงิน/คอมมิชชั่น) -->
            <a href="https://tonsk.github.io/98/com" class="link-card" target="_blank">
                <div class="link-left">
                    <div class="icon-box">
                        <i class="fa-solid fa-hand-holding-dollar"></i>
                    </div>
                    <span class="link-title">Commission</span>
                </div>
                <span class="link-arrow">➔</span>
            </a>

            <!-- Incentive (use trophy icon) -->
            <a href="https://tonsk.github.io/98/incentive" class="link-card" target="_blank">
                <div class="link-left">
                    <div class="icon-box">
                        <i class="fa-solid fa-trophy"></i>
                    </div>
                    <span class="link-title">Incentive</span>
                </div>
                <span class="link-arrow">➔</span>
            </a>

            <!-- IRR (use chart-line icon) -->
            <a href="https://tonsk.github.io/98/IRR" class="link-card" target="_blank">
                <div class="link-left">
                    <div class="icon-box">
                        <i class="fa-solid fa-chart-line"></i>
                    </div>
                    <span class="link-title">IRR</span>
                </div>
                <span class="link-arrow">➔</span>
            </a>

            <!-- Budget (use wallet icon) -->
            <a href="https://tonsk.github.io/98/budget" class="link-card" target="_blank">
                <div class="link-left">
                    <div class="icon-box">
                        <i class="fa-solid fa-wallet"></i>
                    </div>
                    <span class="link-title">Budget</span>
                </div>
                <span class="link-arrow">➔</span>
            </a>

            <!-- Line (use comments icon) -->
            <a href="https://script.google.com/macros/s/AKfycbyy3DLzz6c0YLY49ZLal3yH5JaS7jT0hxhRFfPY0afOekB-dkXaOfVZtgVvGz5_x4RLlg/exec" class="link-card" target="_blank">
                <div class="link-left">
                    <div class="icon-box">
                        <i class="fa-solid fa-comments"></i>
                    </div>
                    <span class="link-title">Line</span>
                </div>
                <span class="link-arrow">➔</span>
            </a>

            <!-- Digital Agents -->
            <a href="https://da.thailife.com" class="link-card" target="_blank">
                <div class="link-left">
                    <div class="icon-box">
                        <i class="fa-solid fa-circle-user"></i>
                    </div>
                    <span class="link-title">Digital Agents</span>
                </div>
                <span class="link-arrow">➔</span>
            </a>

            <!-- AL4U -->
            <a href="https://agentlearning.thailife.com" class="link-card" target="_blank">
                <div class="link-left">
                    <div class="icon-box">
                        <i class="fa-solid fa-book"></i>
                    </div>
                    <span class="link-title">AL4U</span>
                </div>
                <span class="link-arrow">➔</span>
            </a>
            
            <hr style="border: none; height: 2px; background-color: white;">
            <!-- ใบอนุญาต -->
            <a href="https://smart.oic.or.th/eservice/Menu1" class="link-card" target="_blank">
                <div class="link-left">
                    <div class="icon-box">
                        <i class="fa-solid fa-check"></i>
                    </div>
                    <span class="link-title">ใบอนุญาต</span>
                </div>
                <span class="link-arrow">➔</span>
            </a>
            
        </div>

        <footer>
            &copy; ฝ่ายขยายงานภูมิภาค 98
        </footer>
    </div>

</body>
</html>
