<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ผลประโยชน์ค่าจัดงาน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-thai-life {
            background-color: #047dc2;
        }
        .text-thai-life {
            color: #047dc2;
        }
        .bg-custom-theme {
            background-color: #047dc2;
        }
        .bg-custom-dark {
            background-color: #273482;
        }
    </style>
</head>
<body class="bg-gray-50 p-6 font-sans">

    <div class="max-w-6xl mx-auto bg-white rounded-xl shadow-md relative overflow-hidden">
        <!-- ปุ่ม Reset มุมบนขวา -->
        <button type="button" onclick="resetForm()" class="absolute top-6 right-6 bg-red-500 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-red-600 transition shadow z-10">Reset</button>

        <!-- แถบหัวข้อสี #047dc2 -->
        <div class="bg-thai-life text-white py-6 px-8 mb-8 text-center shadow-md">
            <h1 class="text-2xl md:text-3xl font-bold">ผลประโยชน์ค่าจัดงาน</h1>
        </div>

        <div class="px-8 pb-8">
            <!-- ส่วนเลือกตำแหน่ง -->
            <div class="mb-6">
                <label class="block text-gray-700 text-lg font-medium mb-2">ตำแหน่ง</label>
                <div class="flex gap-4">
                    <button type="button" id="btn-unit" onclick="setPosition('unit')" class="flex-1 py-3 px-6 rounded-lg text-lg font-medium transition-all bg-custom-theme text-white shadow">หน่วย</button>
                    <button type="button" id="btn-center" onclick="setPosition('center')" class="flex-1 py-3 px-6 rounded-lg text-lg font-medium transition-all bg-gray-200 text-gray-700 hover:bg-gray-300">ศูนย์</button>
                    <button type="button" id="btn-region" onclick="setPosition('region')" class="flex-1 py-3 px-6 rounded-lg text-lg font-medium transition-all bg-gray-200 text-gray-700 hover:bg-gray-300">ภาค</button>
                </div>
                <input type="hidden" id="position" value="unit">
            </div>

            <!-- ฟิลด์กรอกข้อมูลระดับหน่วย (แสดงเสมอ) -->
            <div id="unit-inputs-section" class="mb-6">
                <h2 class="text-md font-bold text-thai-life mb-2">ข้อมูลระดับหน่วย</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 p-4 bg-blue-50/50 rounded-lg border border-blue-100">
                    <div>
                        <label class="block text-gray-700 text-lg font-medium mb-2">คอมหน่วย non LifeVerse</label>
                        <input type="text" id="comm_unit" class="w-full p-3 border rounded-lg bg-white text-lg" placeholder="0" oninput="formatCommInput(this)" onblur="calculate()">
                    </div>
                    <div>
                        <label class="block text-gray-700 text-lg font-medium mb-2">คอมหน่วย LifeVerse</label>
                        <input type="text" id="comm_lv_unit" class="w-full p-3 border rounded-lg bg-white text-lg" placeholder="0" oninput="formatCommInput(this)" onblur="calculate()">
                    </div>
                    <div>
                        <label class="block text-gray-700 text-lg font-medium mb-2">ผลบังคับหน่วย (%)</label>
                        <input type="text" id="pers_unit" value="85.00" class="w-full p-3 border rounded-lg bg-white text-lg" oninput="formatPercentInput(this)" onblur="formatPercentBlur(this)">
                    </div>
                </div>
            </div>

            <!-- ฟิลด์กรอกข้อมูลระดับศูนย์ (แสดงเมื่อเลือก ศูนย์ หรือ ภาค) -->
            <div id="center-inputs-section" class="mb-6 hidden">
                <h2 class="text-md font-bold text-thai-life mb-2">ข้อมูลระดับศูนย์</h2>
                <div class="grid grid-cols-1 md:grid-cols-5 gap-4 p-4 bg-blue-50/50 rounded-lg border border-blue-100">
                    <div>
                        <label class="block text-gray-700 text-lg font-medium mb-2">คอมศูนย์ non LV</label>
                        <input type="text" id="comm_center" class="w-full p-3 border rounded-lg bg-white text-lg" placeholder="0" oninput="formatCommInput(this)" onblur="calculate()">
                    </div>
                    <div>
                        <label class="block text-gray-700 text-lg font-medium mb-2">คอมศูนย์ LV</label>
                        <input type="text" id="comm_lv_center" class="w-full p-3 border rounded-lg bg-white text-lg" placeholder="0" oninput="formatCommInput(this)" onblur="calculate()">
                    </div>
                    <div>
                        <label class="block text-gray-700 text-lg font-medium mb-2">เบี้ยปีต่อ non LV</label>
                        <input type="text" id="renew_center" class="w-full p-3 border rounded-lg bg-white text-lg" placeholder="0" oninput="formatCommInput(this)" onblur="calculate()">
                    </div>
                    <div>
                        <label class="block text-gray-700 text-lg font-medium mb-2">ผลบังคับ (%)</label>
                        <input type="text" id="pers_center" value="85.00" class="w-full p-3 border rounded-lg bg-white text-lg" oninput="formatPercentInput(this)" onblur="formatPercentBlur(this)">
                    </div>
                    <div>
                        <label class="block text-gray-700 text-lg font-medium mb-2">ทุนประกันตนเอง</label>
                        <input type="text" id="sum_insured" value="200,000" class="w-full p-3 border rounded-lg bg-white text-lg" oninput="formatCommInput(this)" onblur="calculate()">
                    </div>
                </div>
            </div>

            <!-- ฟิลด์กรอกข้อมูลระดับภาค (แสดงเมื่อเลือก ภาค) -->
            <div id="region-inputs-section" class="mb-6 hidden">
                <h2 class="text-md font-bold text-thai-life mb-2">ข้อมูลระดับภาค</h2>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 p-4 bg-blue-50/50 rounded-lg border border-blue-100 mb-4">
                    <div>
                        <label class="block text-gray-700 text-lg font-medium mb-2">คอมภาค non LV</label>
                        <input type="text" id="comm_region" class="w-full p-3 border rounded-lg bg-white text-lg" placeholder="0" oninput="formatCommInput(this)" onblur="calculate()">
                    </div>
                    <div>
                        <label class="block text-gray-700 text-lg font-medium mb-2">คอมภาค LV</label>
                        <input type="text" id="comm_lv_region" class="w-full p-3 border rounded-lg bg-white text-lg" placeholder="0" oninput="formatCommInput(this)" onblur="calculate()">
                    </div>
                    <div>
                        <label class="block text-gray-700 text-lg font-medium mb-2">ผลบังคับ (%)</label>
                        <input type="text" id="pers_region" value="85.00" class="w-full p-3 border rounded-lg bg-white text-lg" oninput="formatPercentInput(this)" onblur="formatPercentBlur(this)">
                    </div>
                    <div>
                        <label class="block text-gray-700 text-lg font-medium mb-2">ทุนประกันตนเอง</label>
                        <input type="text" id="sum_insured_region" value="1,000,000" class="w-full p-3 border rounded-lg bg-white text-lg" oninput="formatCommInput(this)" onblur="calculate()">
                    </div>
                </div>

                <!-- ส่วนเพิ่มศูนย์ย่อยในสังกัดภาค -->
                <div class="p-4 bg-blue-50/30 rounded-lg border border-blue-100">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="text-md font-bold text-thai-life">คอมมิชชั่นศูนย์ในสังกัดภาค</h3>
                        <button type="button" onclick="addCenterRow()" class="bg-[#047dc2] text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-[#036298] transition">+ เพิ่มศูนย์</button>
                    </div>
                    <div id="sub-centers-container" class="space-y-3">
                        <!-- รายการศูนย์ย่อยจะถูกเพิ่มที่นี่ -->
                    </div>
                </div>
            </div>

            <!-- ผลลัพธ์ค่าจัดงาน -->
            <div id="result-container" class="mb-8">
                <!-- ผลลัพธ์จะถูกเรนเดอร์อัตโนมัติที่นี่ -->
            </div>

            <!-- ส่วนแสดงตารางเรทและการ Highlight -->
            <div id="tables-container" class="space-y-6">
                <!-- ตารางจะถูกเรนเดอร์อัตโนมัติที่นี่ -->
            </div>
        </div>
    </div>

    <script>
        const unitCommRates = [
            { min: 10000, rate: 0.35 },
            { min: 5000, rate: 0.25 },
            { min: 2500, rate: 0.15 },
            { min: 0, rate: 0.0 }
        ];

        const unitPersRates = [
            { min: 75, rate: 1.00 },
            { min: 70, rate: 0.90 },
            { min: 65, rate: 0.80 },
            { min: 60, rate: 0.70 },
            { min: 55, rate: 0.60 },
            { min: 0, rate: 0.50 }
        ];

        const regionPersRates = [
            { min: 90, rate: 1.15 },
            { min: 85, rate: 1.10 },
            { min: 80, rate: 1.05 },
            { min: 75, rate: 1.00 },
            { min: 70, rate: 0.95 },
            { min: 65, rate: 0.90 },
            { min: 0, rate: 0.85 }
        ];

        const centerCommRatesType1 = [
            { min: 120000, rate: 0.30 },
            { min: 60000, rate: 0.25 },
            { min: 30000, rate: 0.20 },
            { min: 15000, rate: 0.15 },
            { min: 0, rate: 0.0 }
        ];

        const centerCommRatesType3 = [
            { min: 120000, payout: 15000 },
            { min: 60000, payout: 11000 },
            { min: 30000, payout: 8000 },
            { min: 15000, payout: 5000 },
            { min: 0, payout: 0 }
        ];

        const regionCommRatesType1 = [
            { min: 300000, rate: 0.18 },
            { min: 240000, rate: 0.16 },
            { min: 180000, rate: 0.14 },
            { min: 120000, rate: 0.12 },
            { min: 60000, rate: 0.10 },
            { min: 0, rate: 0.0 }
        ];

        const regionCommRatesType2 = [
            { min: 120000, payout: 2500 },
            { min: 60000, payout: 2000 },
            { min: 30000, payout: 1500 },
            { min: 15000, payout: 1000 },
            { min: 0, payout: 0 }
        ];

        const regionCommRatesType3 = [
            { min: 120000, payout: 12000 },
            { min: 60000, payout: 10000 },
            { min: 0, payout: 0 }
        ];

        let subCenterCount = 0;

        function formatCommInput(input) {
            let value = input.value.replace(/[^0-9]/g, '');
            if (value !== '') {
                input.value = Number(value).toLocaleString('en-US');
            } else {
                input.value = '';
            }
            calculate();
        }

        function formatPercentInput(input) {
            calculate();
        }

        function formatPercentBlur(input) {
            let val = parseFloat(input.value);
            if (!isNaN(val)) {
                input.value = val.toFixed(2);
            } else {
                input.value = '0.00';
            }
            calculate();
        }

        function parseNumber(valueStr) {
            if (!valueStr) return 0;
            return parseFloat(valueStr.toString().replace(/,/g, '')) || 0;
        }

        function setPosition(pos) {
            document.getElementById('position').value = pos;
            const btnUnit = document.getElementById('btn-unit');
            const btnCenter = document.getElementById('btn-center');
            const btnRegion = document.getElementById('btn-region');
            
            const unitSection = document.getElementById('unit-inputs-section');
            const centerSection = document.getElementById('center-inputs-section');
            const regionSection = document.getElementById('region-inputs-section');

            [btnUnit, btnCenter, btnRegion].forEach(b => {
                b.className = "flex-1 py-3 px-6 rounded-lg text-lg font-medium transition-all bg-gray-200 text-gray-700 hover:bg-gray-300";
            });

            if (pos === 'unit') {
                btnUnit.className = "flex-1 py-3 px-6 rounded-lg text-lg font-medium transition-all bg-custom-theme text-white shadow";
                unitSection.classList.remove('hidden');
                centerSection.classList.add('hidden');
                regionSection.classList.add('hidden');
            } else if (pos === 'center') {
                btnCenter.className = "flex-1 py-3 px-6 rounded-lg text-lg font-medium transition-all bg-custom-theme text-white shadow";
                unitSection.classList.remove('hidden');
                centerSection.classList.remove('hidden');
                regionSection.classList.add('hidden');
            } else if (pos === 'region') {
                btnRegion.className = "flex-1 py-3 px-6 rounded-lg text-lg font-medium transition-all bg-custom-theme text-white shadow";
                unitSection.classList.remove('hidden');
                centerSection.classList.remove('hidden');
                regionSection.classList.remove('hidden');
                if (subCenterCount === 0) {
                    addCenterRow();
                }
            }
            calculate();
        }

        function addCenterRow() {
            subCenterCount++;
            const container = document.getElementById('sub-centers-container');
            const rowId = `sub_center_${subCenterCount}`;
            const div = document.createElement('div');
            div.className = "flex items-center gap-3 bg-blue-50 p-3 rounded-lg border border-blue-300 shadow-sm";
            div.id = rowId;
            div.innerHTML = `
                <span class="font-bold text-thai-life min-w-[70px]">ศูนย์ ${subCenterCount}</span>
                <div class="flex-1">
                    <input type="text" placeholder="คอมศูนย์ ${subCenterCount}" class="sub-center-input w-full p-2 border border-gray-300 rounded-lg text-lg bg-white" oninput="formatCommInput(this)" onblur="calculate()">
                </div>
                <button type="button" onclick="removeCenterRow('${rowId}')" class="text-red-500 hover:text-red-700 font-bold px-3">ลบ</button>
            `;
            container.appendChild(div);
            calculate();
        }

        function removeCenterRow(rowId) {
            const elem = document.getElementById(rowId);
            if (elem) {
                elem.remove();
                calculate();
            }
        }

        function resetForm() {
            const currentPos = document.getElementById('position').value;

            document.querySelectorAll('input[type="text"]').forEach(input => {
                input.value = '';
            });

            document.getElementById('pers_unit').value = '85.00';
            document.getElementById('pers_center').value = '85.00';
            document.getElementById('sum_insured').value = '200,000';
            document.getElementById('pers_region').value = '85.00';
            document.getElementById('sum_insured_region').value = '1,000,000';

            document.getElementById('sub-centers-container').innerHTML = '';
            subCenterCount = 0;

            setPosition(currentPos);
        }

        function getMatchingRate(value, rates) {
            for (let r of rates) {
                if (value >= r.min) return r;
            }
            return rates[rates.length - 1];
        }

        function calculate() {
            const pos = document.getElementById('position').value;
            const container = document.getElementById('tables-container');
            const resultContainer = document.getElementById('result-container');
            container.innerHTML = '';

            const commU = parseNumber(document.getElementById('comm_unit').value);
            const commLvU = parseNumber(document.getElementById('comm_lv_unit').value);
            const persU = parseNumber(document.getElementById('pers_unit').value);
            
            const totalCommForRate = commU + commLvU;
            const matchedCommU = getMatchingRate(totalCommForRate, unitCommRates);
            const matchedPersU = getMatchingRate(persU, unitPersRates);

            const partNonLvUnit = commU * matchedCommU.rate * matchedPersU.rate;
            const partLvUnit = commLvU * 0.30 * matchedPersU.rate;
            const totalUnit = Math.round(partNonLvUnit + partLvUnit);

            if (pos === 'unit') {
                resultContainer.innerHTML = `
                    <div class="space-y-3">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                            <div class="bg-custom-theme text-white p-4 rounded-xl text-center shadow">
                                <h3 class="text-sm font-medium">ค่าจัดงาน non LifeVerse</h3>
                                <p class="text-2xl font-bold mt-1">${Math.round(partNonLvUnit).toLocaleString('th-TH')} ฿</p>
                            </div>
                            <div class="bg-custom-theme text-white p-4 rounded-xl text-center shadow">
                                <h3 class="text-sm font-medium">ค่าจัดงาน LifeVerse</h3>
                                <p class="text-2xl font-bold mt-1">${Math.round(partLvUnit).toLocaleString('th-TH')} ฿</p>
                            </div>
                        </div>
                        <div class="bg-custom-dark text-white p-4 rounded-xl text-center shadow">
                            <h3 class="text-sm font-medium">ค่าจัดงานหน่วย</h3>
                            <p class="text-3xl font-extrabold mt-1">${totalUnit.toLocaleString('th-TH')} ฿</p>
                        </div>
                    </div>
                `;
            } else if (pos === 'center') {
                const commC = parseNumber(document.getElementById('comm_center').value);
                const commLvC = parseNumber(document.getElementById('comm_lv_center').value);
                const persC = parseNumber(document.getElementById('pers_center').value);
                const renewC = parseNumber(document.getElementById('renew_center').value);
                const sumInsured = parseNumber(document.getElementById('sum_insured').value);

                const totalCommCenterForRate = commC + commLvC;
                const matchedCommC1 = getMatchingRate(totalCommCenterForRate, centerCommRatesType1);
                const matchedPersC = getMatchingRate(persC, unitPersRates);
                const matchedCommC3 = getMatchingRate(totalCommCenterForRate, centerCommRatesType3);

                let rawType1NonLv = commC * matchedCommC1.rate * matchedPersC.rate;
                let rawType1Lv = commLvC * 0.25 * matchedPersC.rate;
                let rawType2 = renewC * 0.008 * matchedPersC.rate;
                let rawType3 = matchedCommC3.payout;

                if (sumInsured < 200000) {
                    rawType1NonLv *= 0.90;
                    rawType1Lv *= 0.90;
                }

                const type1NonLv = Math.round(rawType1NonLv);
                const type1Lv = Math.round(rawType1Lv);
                const type2 = Math.round(rawType2);
                const type3 = Math.round(rawType3);

                const totalCenter = type1NonLv + type1Lv + type2 + type3;
                const grandTotal = totalUnit + totalCenter;

                resultContainer.innerHTML = `
                    <div class="space-y-3">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                            <div class="bg-custom-theme text-white p-4 rounded-xl text-center shadow">
                                <h3 class="text-sm font-medium">ค่าจัดงาน non LifeVerse</h3>
                                <p class="text-2xl font-bold mt-1">${Math.round(partNonLvUnit).toLocaleString('th-TH')} ฿</p>
                            </div>
                            <div class="bg-custom-theme text-white p-4 rounded-xl text-center shadow">
                                <h3 class="text-sm font-medium">ค่าจัดงาน LifeVerse</h3>
                                <p class="text-2xl font-bold mt-1">${Math.round(partLvUnit).toLocaleString('th-TH')} ฿</p>
                            </div>
                        </div>
                        <div class="bg-custom-dark text-white p-4 rounded-xl text-center shadow">
                            <h3 class="text-sm font-medium">ค่าจัดงานหน่วย</h3>
                            <p class="text-3xl font-extrabold mt-1">${totalUnit.toLocaleString('th-TH')} ฿</p>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
                            <div class="bg-custom-theme text-white p-4 rounded-xl text-center shadow">
                                <h3 class="text-sm font-medium">ศูนย์ประเภท 1 non LV</h3>
                                <p class="text-xl font-bold mt-1">${type1NonLv.toLocaleString('th-TH')} ฿</p>
                            </div>
                            <div class="bg-custom-theme text-white p-4 rounded-xl text-center shadow">
                                <h3 class="text-sm font-medium">ศูนย์ประเภท 1 LV</h3>
                                <p class="text-xl font-bold mt-1">${type1Lv.toLocaleString('th-TH')} ฿</p>
                            </div>
                            <div class="bg-custom-theme text-white p-4 rounded-xl text-center shadow">
                                <h3 class="text-sm font-medium">ศูนย์ประเภท 2</h3>
                                <p class="text-xl font-bold mt-1">${type2.toLocaleString('th-TH')} ฿</p>
                            </div>
                            <div class="bg-custom-theme text-white p-4 rounded-xl text-center shadow">
                                <h3 class="text-sm font-medium">ศูนย์ประเภท 3</h3>
                                <p class="text-xl font-bold mt-1">${type3.toLocaleString('th-TH')} ฿</p>
                            </div>
                        </div>
                        <div class="bg-custom-dark text-white p-4 rounded-xl text-center shadow">
                            <h3 class="text-sm font-medium">ค่าจัดงานศูนย์</h3>
                            <p class="text-3xl font-extrabold mt-1">${totalCenter.toLocaleString('th-TH')} ฿</p>
                        </div>
                        <div class="bg-black text-white p-4 rounded-xl text-center shadow">
                            <h3 class="text-sm font-medium">รวมทั้งหมด</h3>
                            <p class="text-3xl font-extrabold mt-1">${grandTotal.toLocaleString('th-TH')} ฿</p>
                        </div>
                    </div>
                `;
            } else if (pos === 'region') {
                const commC = parseNumber(document.getElementById('comm_center').value);
                const commLvC = parseNumber(document.getElementById('comm_lv_center').value);
                const persC = parseNumber(document.getElementById('pers_center').value);
                const renewC = parseNumber(document.getElementById('renew_center').value);
                const sumInsured = parseNumber(document.getElementById('sum_insured').value);

                const totalCommCenterForRate = commC + commLvC;
                const matchedCommC1 = getMatchingRate(totalCommCenterForRate, centerCommRatesType1);
                const matchedPersC = getMatchingRate(persC, unitPersRates);
                const matchedCommC3 = getMatchingRate(totalCommCenterForRate, centerCommRatesType3);

                let rawType1NonLv = commC * matchedCommC1.rate * matchedPersC.rate;
                let rawType1Lv = commLvC * 0.25 * matchedPersC.rate;
                let rawType2 = renewC * 0.008 * matchedPersC.rate;
                let rawType3 = matchedCommC3.payout;
                if (sumInsured < 200000) {
                    rawType1NonLv *= 0.90;
                    rawType1Lv *= 0.90;
                }
                const type1NonLv = Math.round(rawType1NonLv);
                const type1Lv = Math.round(rawType1Lv);
                const type2 = Math.round(rawType2);
                const type3 = Math.round(rawType3);
                const totalCenter = type1NonLv + type1Lv + type2 + type3;

                // คำนวณภาค
                const commR = parseNumber(document.getElementById('comm_region').value);
                const commLvR = parseNumber(document.getElementById('comm_lv_region').value);
                const persR = parseNumber(document.getElementById('pers_region').value);
                const sumInsuredRegion = parseNumber(document.getElementById('sum_insured_region').value);

                const totalCommRegionForRate = commR + commLvR;
                const matchedCommR1 = getMatchingRate(totalCommRegionForRate, regionCommRatesType1);
                const matchedPersR = getMatchingRate(persR, regionPersRates);
                const matchedCommR3 = getMatchingRate(totalCommRegionForRate, regionCommRatesType3);

                let rawRegionType1NonLv = commR * matchedPersR.rate * matchedCommR1.rate;
                let rawRegionType1Lv = commLvR * 0.15 * matchedPersR.rate;
                if (sumInsuredRegion < 1000000) {
                    rawRegionType1NonLv *= 0.90;
                    rawRegionType1Lv *= 0.90;
                }
                const regionType1NonLv = Math.round(rawRegionType1NonLv);
                const regionType1Lv = Math.round(rawRegionType1Lv);

                // ภาคประเภท 2 (รวมจากศูนย์ที่เพิ่มมาแต่ละศูนย์)

                const regionCommRowsType3 = regionCommRatesType3.map(item => {
